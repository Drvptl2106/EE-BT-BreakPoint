<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://mqyeqrxzjzsfvbbjppxj.supabase.co; base-uri 'none'; form-action 'self'"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0E6E77"><link rel="manifest" href="app.webmanifest"><link rel="icon" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Break Point"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="src/styles.css?v=dd56730b06"><script src="src/theme.js?v=dd56730b06"></script><title>breakpoint</title></head><body>
<main id="gate" class="wrap gate hidden"><div class="mark">break<span>point</span></div><h1>Welcome back</h1><p>Sign in with your code to start today's shift.</p>
<form id="gateForm" autocomplete="off"><input id="code" placeholder="e.g. EE-001" aria-label="Your code" autocapitalize="characters" required><input id="pw" class="hidden" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password"><p id="gateErr" class="err" role="alert"></p><button class="btn teal" style="width:100%;padding:14px">Sign in</button></form>
<p class="hint" style="margin-top:18px"><a class="link" href="manager.html">Team lead? Manager sign-in &rarr;</a></p></main>

<div id="app" class="hidden">
<header class="band"><div class="in"><div class="mark">break<span>point</span></div>
<nav class="tabs" aria-label="Sections"><button data-tab="day"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>My day</span></button><button data-tab="race"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 01-8 0V4zM8 6H5v1a3 3 0 003 3M16 6h3v1a3 3 0 01-3 3M12 13v4M8.5 20h7"/></svg><span data-race-name>Breakathon</span></button><button data-tab="ideas"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0012 3z"/></svg><span>Ideas</span></button></nav>
<div class="who"><span class="live" id="live"><i></i><b>Live</b><time id="clock">--:--:--</time></span><span id="who"></span><button class="theme" id="themeBtn" aria-label="Switch light or dark mode"></button><button class="theme" id="uiBtn"></button><button class="link" id="pwBtn" aria-label="Change password" title="Change password"><svg viewBox="0 0 24 24" width="16" height="16" class="ico" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/></svg><span class="lbl">Password</span></button><button class="link" id="signout" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" width="16" height="16" class="ico" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg><span class="lbl">Sign out</span></button></div></div></header>

<main class="wrap" id="tab-day">
<section class="panel" aria-labelledby="brkH"><div class="phead"><h2 id="brkH">Your breaks</h2><span class="phead-r"><span class="hint" id="brkSum"></span><button class="cust" id="custBtn" type="button" aria-label="Customise your mascot" title="Customise your mascot"><span class="cust-av" id="custAv" aria-hidden="true"></span></button></span></div><div class="bars" id="bars"></div></section>

<section class="panel" aria-labelledby="shH"><div class="phead"><h2 id="shH">Your shift</h2><span class="hint" id="startHint"></span></div>
<div class="shiftgrid"><div>
  <div class="shiftrow"><div class="field"><label for="startIn">Shift start</label><input type="time" id="startIn"></div><div class="field"><label for="endIn">Shift end</label><input type="time" id="endIn"></div>
  <div class="chips"><button class="chip" data-len="8">8h</button><button class="chip" data-len="8.5">8½h</button><button class="chip" data-len="9">9h</button></div></div>
  <div class="pie"><svg viewBox="0 0 220 220" aria-hidden="true"><g id="arcs" transform="rotate(-90 110 110)"></g><g id="nowMark"></g></svg>
    <div class="c"><div class="t" id="worked">0:00:00</div><small id="workedLbl">worked</small></div></div>
  <div class="legend"><span><i style="background:var(--teal)"></i>Worked</span><span><i style="background:var(--ee-yellow)"></i>Breaks</span><span><i style="background:var(--stop)"></i>Over</span><span><i style="background:var(--line)"></i>Still to go</span></div>
</div><div>
  <div class="pep" id="bubble" aria-live="polite"><div class="k" id="pepK"></div><p id="joke"></p></div>
  <dl class="stats"><div class="stat"><dt>Breaks taken</dt><dd id="sTaken"></dd></div><div class="stat"><dt>Break time used</dt><dd id="sUsed"></dd></div><div class="stat"><dt>Shift time left</dt><dd id="sLeft">–</dd></div><div class="stat"><dt>Working time left</dt><dd id="sWork">–</dd></div></dl>
</div></div></section>
</main>

<main class="wrap hidden" id="tab-race"><section class="panel"><div class="phead"><h2 data-race-name>Breakathon</h2><div class="seg2" id="weekSel"><button data-week="0" aria-pressed="true">This week</button><button data-week="1" aria-pressed="false">Last week</button></div></div><div id="prize"></div><div id="race"><p class="empty">Loading the race…</p></div></section><div id="look"></div></main>
<main class="wrap hidden" id="tab-ideas"><div id="ideas"></div></main>
</div>
